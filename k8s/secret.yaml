# Edit the values below before applying.
# Generate a strong password: python -c "import secrets; print(secrets.token_urlsafe(32))"
apiVersion: v1
kind: Secret
metadata:
  name: orchivio-secrets
  namespace: orchivio
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  # Required only when ORCHIVIO_LLM_PROVIDER=anthropic
  ORCHIVIO_ANTHROPIC_API_KEY: ""
  # Optional: enables /metrics endpoint (Bearer token)
  ORCHIVIO_METRICS_TOKEN: ""
