---
# initdb script: creates the orchivio_preview database on first boot
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: orchivio
data:
  10-preview.sql: |
    CREATE DATABASE orchivio_preview OWNER orchivio;

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: orchivio
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: orchivio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate  # single-writer; prevents split-brain during rollouts
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: orchivio
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orchivio-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: orchivio
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "orchivio"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: initdb
          configMap:
            name: postgres-initdb

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: orchivio
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
