# Local development stack. Not hardened for production use.
# Usage: cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: orchivio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: orchivio
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchivio"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://orchivio:${POSTGRES_PASSWORD}@db:5432/orchivio
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      ORCHIVIO_ENV: ${ORCHIVIO_ENV:-dev}
      ORCHIVIO_ALLOW_REGISTRATION: ${ORCHIVIO_ALLOW_REGISTRATION:-true}
      ORCHIVIO_LOG_JSON: "true"
      ORCHIVIO_DATABASE_URL: postgresql+psycopg://orchivio:${POSTGRES_PASSWORD}@db:5432/orchivio
      ORCHIVIO_PREVIEW_DATABASE_URL: postgresql+psycopg://orchivio:${POSTGRES_PASSWORD}@db:5432/orchivio_preview
      ORCHIVIO_LLM_PROVIDER: ${ORCHIVIO_LLM_PROVIDER:-none}
      ORCHIVIO_ANTHROPIC_API_KEY: ${ORCHIVIO_ANTHROPIC_API_KEY:-}
      ORCHIVIO_LLM_MODEL: ${ORCHIVIO_LLM_MODEL:-}
      ORCHIVIO_ARTIFACT_DIR: /data/artifacts
    volumes:
      - artifacts:/data/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  artifacts:
