[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orchivio"
version = "0.1.0.dev0"
description = "AI-native application engineering low/no-code platform (pre-alpha)"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "agNedia Inc." }]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "PyYAML>=6",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "fastapi>=0.110",
]

[project.scripts]
orchivio = "orchivio.cli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
server = ["uvicorn>=0.29"]
anthropic = ["httpx>=0.27"]
delivery = ["cryptography>=42"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["cryptography>=42", "opentelemetry-sdk>=1.25", "pytest>=8", "httpx>=0.27", "ruff>=0.5", "hypothesis>=6", "jsonschema>=4", "openapi-spec-validator>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orchivio.api" = ["appshell_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "postgres: tests requiring a real PostgreSQL database (set ORCHIVIO_TEST_PG_URL)",
  "live_api: tests that call real external APIs (set ORCHIVIO_LIVE_LLM=1 and ORCHIVIO_ANTHROPIC_API_KEY)",
  "eval: AI quality eval harness (set ORCHIVIO_LIVE_LLM=1 and ORCHIVIO_ANTHROPIC_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is not enforced: the code base uses long, dense lines on purpose and has no formatter.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["I", "UP", "E", "B"]  # generated by Alembic, then edited by hand
