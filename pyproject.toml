[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchivio"
version = "0.1.0.dev0"
description = "AI-native application engineering low/no-code platform (pre-alpha)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "PyYAML>=6",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "fastapi>=0.110",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
server = ["uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
