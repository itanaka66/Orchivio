server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers applied to every response from this server block.
    # The appshell (served by FastAPI) sets its own stricter CSP for its HTML pages.
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    # Vite production builds emit no inline scripts; all JS and CSS live in
    # hashed external files, so 'unsafe-inline' is not needed for scripts.
    # style-src 'unsafe-inline' is kept for React libraries that inject inline
    # styles at run time (e.g. focus rings, popovers).
    add_header Content-Security-Policy
        "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
        always;

    # Proxy API and ops endpoints to the FastAPI backend
    location ~ ^/(api|healthz|readyz|metrics)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow large model/import payloads
        client_max_body_size 64m;
        proxy_read_timeout 120s;
    }

    # Static assets: long-lived cache (Vite hashes filenames)
    location ~* \.(?:js|css|woff2?|png|svg|ico|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback — all other requests serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
