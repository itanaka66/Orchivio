server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and ops endpoints to the FastAPI backend
    location ~ ^/(api|healthz|readyz|metrics)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow large model/import payloads
        client_max_body_size 64m;
        proxy_read_timeout 120s;
    }

    # Static assets: long-lived cache (Vite hashes filenames)
    location ~* \.(?:js|css|woff2?|png|svg|ico|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — all other requests serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
