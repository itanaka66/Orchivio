name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orchivio
          POSTGRES_PASSWORD: orchivio
          POSTGRES_DB: orchivio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orchivio" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://orchivio:orchivio@localhost:5432/orchivio
      ORCHIVIO_TEST_PG_URL: postgresql+psycopg://orchivio:orchivio@localhost:5432/orchivio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      # PostgreSQL-only behaviour: triggers, circular FKs, SQL predicate dialect, runtime types.
      - run: pytest tests/integration/test_postgres.py
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
