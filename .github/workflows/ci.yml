name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  appshell-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,server]"
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e:appshell
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: appshell-playwright-traces
          path: apps/web/test-results
          retention-days: 7

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orchivio
          POSTGRES_PASSWORD: orchivio
          POSTGRES_DB: orchivio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orchivio" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://orchivio:orchivio@localhost:5432/orchivio
      ORCHIVIO_TEST_PG_URL: postgresql+psycopg://orchivio:orchivio@localhost:5432/orchivio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      # PostgreSQL-only behaviour: triggers, circular FKs, SQL predicate dialect, runtime types.
      - run: pytest -m postgres -v
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (validates Dockerfile syntax and pip install)
        run: docker build --no-cache -t orchivio-api .
      - name: Build web image (validates Dockerfile and npm build)
        run: docker build --no-cache -t orchivio-web apps/web
      - name: Start the backend stack and wait for health checks to pass
        # Starts db + migrate (one-shot) + api; --wait blocks until api healthcheck is green.
        # The web service is omitted here; its image was already validated above.
        run: docker compose up --wait api
      - name: Confirm /readyz returns status=ready
        run: |
          curl -fsS http://localhost:8000/readyz | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(d)
          assert d['status'] == 'ready', f'expected ready, got {d}'
          "
      - name: Stop all services and remove volumes
        if: always()
        run: docker compose down -v

  live-api:
    runs-on: ubuntu-latest
    if: ${{ secrets.ORCHIVIO_ANTHROPIC_API_KEY != '' }}
    env:
      ORCHIVIO_LIVE_LLM: "1"
      ORCHIVIO_ANTHROPIC_API_KEY: ${{ secrets.ORCHIVIO_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,anthropic]"
      # Runs the direct AnthropicProvider adapter test and the AIBuilder integration tests.
      - run: pytest -m live_api -v

  eval:
    runs-on: ubuntu-latest
    if: ${{ secrets.ORCHIVIO_ANTHROPIC_API_KEY != '' }}
    env:
      ORCHIVIO_LIVE_LLM: "1"
      ORCHIVIO_ANTHROPIC_API_KEY: ${{ secrets.ORCHIVIO_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,anthropic]"
      # Runs the quality eval rubrics against the real model. Results are shown per rubric.
      - run: pytest -m eval -v
